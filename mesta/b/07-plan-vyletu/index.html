<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Úkol 7 – Plán dne podle počasí | Malý cestovatel</title>
<style>
  :root{
    --accent:#0f6cbd; --accent-dark:#115ea3;
    --app-bg:#faf9f8; --border:#edebe9; --border-strong:#e1dfdd;
    --text:#242424; --text-2:#616161; --unread:#0f6cbd;
    --sel:#e9f0f8; --sel-strong:#cfe4fa;
    --ok:#107c10; --err:#d13438; --rail:#223049; --rail-2:#2c3e5e;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{margin:0;font-family:"Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
    color:var(--text);background:#f3f2f1;display:flex;flex-direction:column;height:100vh;overflow:hidden;}

  .game-bar{flex:0 0 auto;height:52px;background:#fff;border-bottom:1px solid var(--border-strong);
    display:flex;align-items:center;justify-content:space-between;padding:0 18px;box-shadow:0 1px 3px rgba(0,0,0,.04);z-index:5;}
  .game-bar .brand{font-weight:700;font-size:16px;}
  .game-bar .brand .plane{margin-right:6px;}
  .game-bar .task-name{color:var(--text-2);font-size:14px;}
  .progress-pill{background:var(--accent);color:#fff;font-size:13px;font-weight:600;padding:5px 12px;border-radius:999px;}

  .os-body{flex:1;display:flex;min-height:0;}
  .rail{flex:0 0 190px;background:var(--rail);color:#eaeef6;display:flex;flex-direction:column;gap:6px;padding:14px 10px;}
  .rail .rail-title{font-size:12px;letter-spacing:.5px;text-transform:uppercase;color:#8ea2c4;padding:4px 10px 10px;}
  .rail-app{display:flex;align-items:center;gap:12px;width:100%;background:transparent;border:none;color:#eaeef6;
    padding:11px 12px;border-radius:10px;cursor:pointer;font-size:15px;text-align:left;font-family:inherit;}
  .rail-app:hover{background:var(--rail-2);}
  .rail-app.active{background:var(--accent);color:#fff;}
  .rail-app .ri{font-size:20px;width:24px;text-align:center;}
  .rail-app.glow{box-shadow:0 0 0 0 rgba(255,196,0,.7);animation:glowpulse 1.8s infinite;}
  @keyframes glowpulse{0%{box-shadow:0 0 0 0 rgba(255,196,0,.75);}70%{box-shadow:0 0 0 12px rgba(255,196,0,0);}100%{box-shadow:0 0 0 0 rgba(255,196,0,0);}}

  .screen{flex:1;min-width:0;position:relative;overflow:hidden;background:#fff;}

  .desktop{height:100%;width:100%;background:linear-gradient(160deg,#9ed0ff 0%,#6aa9e9 45%,#4f8fd6 100%);padding:26px;position:relative;}
  .desktop .plane-deco{position:absolute;right:40px;top:30px;font-size:54px;transform:rotate(-8deg);opacity:.9;}
  .desk-grid{display:grid;grid-template-columns:repeat(auto-fill,96px);gap:18px 14px;align-content:start;}
  .desk-icon{width:96px;background:transparent;border:none;cursor:pointer;display:flex;flex-direction:column;align-items:center;
    gap:7px;padding:8px 4px;border-radius:10px;font-family:inherit;color:#0a2a4d;}
  .desk-icon .di{width:60px;height:60px;border-radius:14px;background:#fff;display:flex;align-items:center;justify-content:center;
    font-size:30px;box-shadow:0 4px 10px rgba(0,0,0,.18);}
  .desk-icon .dl{font-size:13px;font-weight:600;color:#06264a;background:rgba(255,255,255,.55);padding:1px 7px;border-radius:6px;}
  .desk-icon:hover:not(.disabled){background:rgba(255,255,255,.22);}
  .desk-icon.disabled{cursor:default;opacity:.65;}
  .desk-icon.glow .di{animation:glowpulse 1.8s infinite;}
  .start-here{margin-top:2px;font-size:11px;font-weight:700;color:#fff;background:#e8820c;padding:3px 8px;border-radius:999px;white-space:nowrap;box-shadow:0 2px 6px rgba(0,0,0,.2);}

  .appwin,.mailapp{display:flex;flex-direction:column;height:100%;}
  .app-title{flex:0 0 auto;height:46px;background:var(--accent);color:#fff;display:flex;align-items:center;gap:16px;padding:0 16px;font-weight:600;font-size:15px;}
  .app-title .search{flex:1;max-width:440px;background:rgba(255,255,255,.18);border-radius:4px;padding:7px 12px;font-size:13px;color:#eaf2fb;font-weight:400;}

  /* mail */
  .mail-body{flex:1;display:flex;min-height:0;}
  .folders{flex:0 0 210px;background:var(--app-bg);border-right:1px solid var(--border);padding:12px 8px;overflow-y:auto;}
  .compose{width:100%;border:1px solid var(--border-strong);background:#fff;color:var(--accent);font-weight:600;font-size:14px;padding:9px 12px;border-radius:6px;cursor:pointer;margin-bottom:12px;text-align:left;font-family:inherit;}
  .folders ul{list-style:none;margin:0;padding:0;}
  .folders li{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:6px;font-size:14px;color:var(--text);}
  .folders li .cnt{margin-left:auto;color:var(--text-2);font-size:12px;font-weight:600;}
  .folders li.active{background:var(--sel-strong);font-weight:600;}
  .list{flex:0 0 340px;background:#fff;border-right:1px solid var(--border);overflow-y:auto;}
  .list-head{padding:12px 16px;font-weight:700;font-size:16px;border-bottom:1px solid var(--border);position:sticky;top:0;background:#fff;}
  .email-row{display:flex;gap:12px;padding:12px 16px 12px 12px;border-bottom:1px solid var(--border);cursor:pointer;border-left:3px solid transparent;}
  .email-row:hover{background:#f5f9fd;}
  .email-row.selected{background:var(--sel);border-left-color:var(--accent);}
  .email-row.unread{border-left-color:var(--unread);}
  .email-main{flex:1;min-width:0;}
  .email-line1{display:flex;align-items:center;gap:8px;}
  .email-sender{font-size:14px;}
  .email-row.unread .email-sender{font-weight:700;}
  .email-time{margin-left:auto;font-size:12px;color:var(--text-2);white-space:nowrap;}
  .email-subject{font-size:13px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .email-row.unread .email-subject{font-weight:600;color:var(--accent-dark);}
  .email-preview{font-size:12px;color:var(--text-2);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .dot{flex:0 0 8px;height:8px;border-radius:50%;background:var(--unread);align-self:center;}
  .dot.hidden{visibility:hidden;}
  .reader{flex:1;background:#fff;overflow-y:auto;padding:24px 32px;min-width:0;}
  .reader .subject{font-size:21px;font-weight:600;margin:0 0 14px;}
  .reader-head{display:flex;gap:12px;align-items:center;padding-bottom:16px;border-bottom:1px solid var(--border);margin-bottom:18px;}
  .reader-head .avatar{flex:0 0 40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-size:14px;font-weight:600;}
  .reader-from .name{font-weight:600;font-size:14px;}
  .reader-from .meta{font-size:12px;color:var(--text-2);}
  .reader-body{font-size:15px;line-height:1.6;max-width:720px;}
  .reader-body p{margin:0 0 12px;}
  .avatar{flex:0 0 36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-size:14px;font-weight:600;}

  /* ---- Počasí ---- */
  .pocasi{flex:1;overflow:auto;padding:22px;background:#eaf3fb;}
  .pocasi h2{margin:0 0 6px;font-size:18px;}
  .pocasi .sub{color:var(--text-2);font-size:14px;margin:0 0 16px;}
  .fc-row{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px;}
  .fc-card{min-width:74px;background:#fff;border:1px solid var(--border-strong);border-radius:10px;padding:10px 6px;text-align:center;}
  .fc-card .ft{font-size:12px;color:var(--text-2);}
  .fc-card .fi{font-size:26px;line-height:1.3;}
  .fc-card .fd{font-size:11px;color:var(--text-2);}
  .fc-card .fp{font-size:14px;font-weight:700;}
  .slot-sum{display:flex;gap:12px;flex-wrap:wrap;margin-top:18px;}
  .slot-sum .ss{flex:1;min-width:150px;background:#fff;border:1px solid var(--border-strong);border-radius:12px;padding:14px;text-align:center;}
  .slot-sum .ss .sn{font-weight:700;}
  .slot-sum .ss .si{font-size:34px;}
  .slot-sum .ss .sw{color:var(--text-2);font-size:13px;}

  /* ---- Plánovač ---- */
  .plan{flex:1;overflow:auto;padding:18px 22px;background:#f5f6f8;}
  .plan h2.sec{font-size:15px;margin:0 0 10px;}
  .slots{display:flex;gap:14px;flex-wrap:wrap;}
  .slot{flex:1;min-width:210px;background:#fff;border:1px solid var(--border-strong);border-radius:12px;display:flex;flex-direction:column;overflow:hidden;}
  .slot-head{padding:12px 14px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;}
  .slot-head .sh-ic{font-size:24px;}
  .slot-head .sh-name{font-weight:700;}
  .slot-head .sh-w{margin-left:auto;font-size:13px;color:var(--text-2);display:flex;align-items:center;gap:5px;}
  .slot-drop{flex:1;min-height:120px;padding:12px;border:2px dashed transparent;}
  .slot-drop.empty{display:flex;align-items:center;justify-content:center;color:#aab2bd;font-size:13px;border-color:#dfe3e9;margin:8px;border-radius:10px;}

  .pool{margin-top:20px;background:#fff;border:1px solid var(--border-strong);border-radius:12px;padding:14px;}
  .pool-grid{display:flex;flex-wrap:wrap;gap:10px;margin-top:8px;min-height:60px;}

  .acard{background:#fff;border:1px solid var(--border-strong);border-radius:10px;padding:9px 11px;cursor:grab;font-size:13.5px;box-shadow:0 1px 2px rgba(0,0,0,.05);}
  .acard:active{cursor:grabbing;}
  .acard .a-top{display:flex;align-items:center;gap:8px;font-weight:600;}
  .acard .a-ic{font-size:18px;}
  .acard .a-meta{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px;}
  .acard .b{font-size:11px;padding:1px 7px;border-radius:999px;background:#eef1f5;color:#555;}
  .acard .b.sun{background:#fff3d6;color:#8a6d00;}
  .acard .b.any{background:#e7f3e8;color:#1f7a2b;}
  .acard .a-btns{display:flex;gap:5px;margin-top:8px;flex-wrap:wrap;}
  .acard .a-btns button{font-size:11.5px;padding:3px 9px;border-radius:6px;border:1px solid var(--border-strong);background:#fff;cursor:pointer;font-family:inherit;}
  .acard .a-btns button:hover{border-color:var(--accent);background:#eef4fb;}
  .acard.in-slot{margin-bottom:9px;}
  .acard.wrong{border-color:var(--err);background:#fdeeee;}
  .pool-grid .acard{width:200px;}

  .plan-actions{margin-top:18px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;}
  .btn{padding:11px 20px;font-size:15px;font-weight:600;border-radius:8px;cursor:pointer;border:1px solid transparent;font-family:inherit;}
  .btn-primary{background:var(--accent);color:#fff;} .btn-primary:hover{background:var(--accent-dark);}
  #pfb{font-size:13.5px;}
  #pfb .err{color:var(--err);} #pfb ul{margin:4px 0 0;padding-left:18px;}

  .result{max-width:600px;margin:26px auto;text-align:center;background:#fff;border:1px solid #bfe3bf;border-radius:16px;padding:32px;box-shadow:0 6px 24px rgba(0,0,0,.08);}
  .result .big{font-size:56px;} .result h2{color:var(--ok);margin:10px 0 6px;}
  .result p{font-size:15px;margin:4px 0;}
  .plan-summary{text-align:left;max-width:420px;margin:14px auto 0;font-size:14px;}
  .plan-summary .ps-row{display:flex;gap:8px;padding:6px 0;border-bottom:1px dashed var(--border);}
  .plan-summary .ps-row b{flex:0 0 100px;}
  .continue{display:inline-block;margin-top:18px;background:var(--ok);color:#fff;text-decoration:none;padding:12px 24px;border-radius:8px;font-weight:600;font-size:15px;}
  .continue:hover{background:#0b5e0b;}

  .napoveda{flex:1;overflow-y:auto;padding:28px 32px;background:#fafafa;}
  .napoveda .np-wrap{max-width:620px;margin:0 auto;}
  .np-intro{font-size:14px;color:var(--text-2);background:#eef4fb;border:1px solid #cfe0f3;padding:12px 14px;border-radius:8px;margin:0 0 18px;}
  .hint-card{background:#fff;border:1px solid var(--border-strong);border-left:4px solid #e8a30c;border-radius:8px;padding:14px 16px;margin-bottom:14px;}
  .hint-card b{display:block;font-size:12px;letter-spacing:.4px;text-transform:uppercase;color:#b8790a;margin-bottom:6px;}
  .hint-card p{margin:0;font-size:15px;line-height:1.55;}
  .reveal-btn{background:#e8820c;color:#fff;border:none;padding:11px 20px;border-radius:8px;font-size:15px;font-weight:600;cursor:pointer;font-family:inherit;}
  .reveal-btn:hover{background:#cf7109;}
  .all-shown{font-size:13px;color:var(--text-2);}

  @media (max-width:1050px){ .folders{display:none;} }
  @media (max-width:860px){
    .rail{flex:0 0 64px;} .rail .rail-title,.rail-app .rl{display:none;} .rail-app{justify-content:center;}
    .mail-body{flex-direction:column;}
    .list{flex:0 0 auto;max-height:34vh;border-right:none;border-bottom:1px solid var(--border);}
    .slots{flex-direction:column;}
  }
</style>
</head>
<body>

  <div class="game-bar">
    <div class="brand"><span class="plane">✈️</span>Malý cestovatel</div>
    <div class="task-name">Úkol 7 — Naplánuj den podle počasí</div>
    <div class="progress-pill">Úkol 7&nbsp;/&nbsp;7</div>
  </div>

  <div class="os-body">
    <nav class="rail" id="rail"></nav>
    <main class="screen" id="screen"></main>
  </div>

<script>
  /* ---------- počasí (náhodné, mění se po třetinách dne) ---------- */
  const pick=a=>a[Math.floor(Math.random()*a.length)];
  const WEATHERS=[
    {ic:"☀️", lbl:"Slunečno",  cat:"slunecno"},
    {ic:"⛅", lbl:"Polojasno",  cat:"slunecno"},
    {ic:"🌧️", lbl:"Déšť",       cat:"destivo"},
    {ic:"🌦️", lbl:"Přeháňky",   cat:"destivo"}
  ];
  const SLOTS=[
    {id:"rano",      ic:"🌅", name:"Ráno",      hours:[8,9,10,11],            hoursLbl:"8–12 h"},
    {id:"odpoledne", ic:"🏙️", name:"Odpoledne", hours:[12,13,14,15,16,17],    hoursLbl:"12–18 h"},
    {id:"vecer",     ic:"🌆", name:"Večer",     hours:[18,19,20,21],          hoursLbl:"18–22 h"}
  ];
  SLOTS.forEach(s=>{ const w=pick(WEATHERS); s.weather=w.cat; s.wIc=w.ic; s.wLbl=w.lbl; });
  const slotById=id=>SLOTS.find(s=>s.id===id);
  // předpověď po hodinách — v rámci třetiny dne stejná, mění se mezi třetinami
  const TEMP={8:17,9:18,10:20,11:21,12:23,13:23,14:22,15:22,16:21,17:20,18:20,19:19,20:18,21:16};
  const FORECAST=[];
  SLOTS.forEach(s=>s.hours.forEach(h=>{ let t=TEMP[h]; if(s.weather==="destivo") t-=2;
    FORECAST.push({t:`${h}:00`, ic:s.wIc, temp:`${t}°`, d:s.wLbl}); }));

  // parts = ve kterou denní dobu lze; weather: "slunecno" (venku, potřebuje hezké počasí) nebo "any" (za každého počasí)
  const ACTS=[
    {id:"snidane",  ic:"☕", name:"Snídaně s croissantem",      parts:["rano"],              weather:"any"},
    {id:"eiffel",   ic:"🗼", name:"Eiffelova věž (vyhlídka)",   parts:["rano","odpoledne"],  weather:"slunecno"},
    {id:"montmartre",ic:"⛪", name:"Montmartre a Sacré-Cœur",   parts:["rano","odpoledne"],  weather:"slunecno"},
    {id:"louvre",   ic:"🖼️", name:"Muzeum Louvre",              parts:["rano","odpoledne"],  weather:"any"},
    {id:"orsay",    ic:"🎨", name:"Muzeum d'Orsay",             parts:["odpoledne"],         weather:"any"},
    {id:"nakupy",   ic:"🛍️", name:"Nákupy na Champs-Élysées",   parts:["odpoledne","vecer"], weather:"any"},
    {id:"seina",    ic:"🚢", name:"Projížďka lodí po Seině",    parts:["odpoledne","vecer"], weather:"slunecno"},
    {id:"opera",    ic:"🎭", name:"Opera Garnier",              parts:["vecer"],             weather:"any"},
    {id:"vecere",   ic:"🥐", name:"Večeře ve francouzském bistru", parts:["vecer"],          weather:"any"},
    {id:"psg",      ic:"⚽", name:"Fotbal – zápas PSG",             parts:["vecer"],          weather:"slunecno"}
  ];

  /* ---------- stav ---------- */
  let app="plocha";
  let currentId="marco";
  let mailRead=false;
  let hintLevel=0;
  let solved=false;
  const placement={}; ACTS.forEach(a=>placement[a.id]="pool");
  let wrongIds=[];

  /* ---------- e-maily ---------- */
  const emails=[
    { id:"marco", unread:true, sender:"Marco", initials:"M", color:"#b4009e",
      subject:"Naplánujeme si den v Paříži! 🗺️", time:"8:20",
      preview:"Mrkni na počasí a sestav plán na ráno, odpoledne a večer…",
      body:`<p>Ahoj! 🎉 Jsi tady — tak si užijeme den v Paříži!</p>
        <p>Nejdřív mrkni v aplikaci <strong>Počasí 🌤️</strong>, jak bude. Pak v aplikaci <strong>Plánovač 🗺️</strong> sestav <strong>plán dne</strong> — vyber aktivitu na <strong>ráno</strong>, <strong>odpoledne</strong> a <strong>večer</strong>.</p>
        <p>Pozor: každá aktivita se hodí jen na určitou denní dobu a některé potřebují <strong>hezké počasí</strong> (venku). Když prší, naplánuj něco <strong>uvnitř</strong>. Pak dej <strong>Zkontrolovat plán</strong>. Těším se! Marco</p>` },
    { id:"mama", unread:false, sender:"Máma", initials:"M", color:"#107c10",
      subject:"Užij si Paříž! 😘", time:"po",
      preview:"Pošli mi fotku z výletu…",
      body:`<p>Ahoj, snad ses dobře ubytoval(a). Užij si den a pošli mi fotku! 😘 Máma</p>` }
  ];

  const apps=[
    {id:"plocha",icon:"🖥️",label:"Plocha"},{id:"posta",icon:"📧",label:"Pošta"},
    {id:"pocasi",icon:"🌤️",label:"Počasí"},{id:"planovac",icon:"🗺️",label:"Plánovač"},
    {id:"napoveda",icon:"💡",label:"Nápověda"}
  ];

  /* ---------- rail ---------- */
  function renderRail(){
    document.getElementById("rail").innerHTML=`<div class="rail-title">Aplikace</div>`+
      apps.map(a=>{ let glow="";
        if(a.id==="posta" && !mailRead) glow="glow";
        if(a.id==="planovac" && mailRead && !solved) glow="glow";
        return `<button class="rail-app ${app===a.id?'active':''} ${glow}" data-app="${a.id}"><span class="ri">${a.icon}</span><span class="rl">${a.label}</span></button>`;
      }).join("");
  }

  /* ---------- plocha ---------- */
  function plochaHTML(){
    const pg=!mailRead, plg=mailRead&&!solved;
    const posta=`<button class="desk-icon ${pg?'glow':''}" data-app="posta"><span class="di">📧</span><span class="dl">Pošta</span>${pg?'<span class="start-here">Nový e-mail 👆</span>':''}</button>`;
    const pocasi=`<button class="desk-icon" data-app="pocasi"><span class="di">🌤️</span><span class="dl">Počasí</span></button>`;
    const planovac=`<button class="desk-icon ${plg?'glow':''}" data-app="planovac"><span class="di">🗺️</span><span class="dl">Plánovač</span>${plg?'<span class="start-here">Naplánuj den 👆</span>':''}</button>`;
    const napo=`<button class="desk-icon" data-app="napoveda"><span class="di">💡</span><span class="dl">Nápověda</span></button>`;
    const deco=["🗑️ Koš"].map(d=>{const[i,...n]=d.split(" ");return `<div class="desk-icon disabled"><span class="di">${i}</span><span class="dl">${n.join(" ")}</span></div>`;}).join("");
    return `<div class="desktop"><div class="plane-deco">🗺️</div><div class="desk-grid">${posta}${pocasi}${planovac}${napo}${deco}</div></div>`;
  }

  /* ---------- mail ---------- */
  function listHTML(){
    return emails.map(e=>`
      <div class="email-row ${e.unread?'unread':''} ${e.id===currentId?'selected':''}" data-mail="${e.id}">
        <div class="avatar" style="background:${e.color}">${e.initials}</div>
        <div class="email-main">
          <div class="email-line1"><span class="email-sender">${e.sender}</span><span class="email-time">${e.time}</span></div>
          <div class="email-subject">${e.subject}</div><div class="email-preview">${e.preview}</div>
        </div><div class="dot ${e.unread?'':'hidden'}"></div></div>`).join("");
  }
  function readerHTML(){
    const e=emails.find(x=>x.id===currentId);
    return `<div class="subject">${e.subject}</div>
      <div class="reader-head"><div class="avatar" style="background:${e.color}">${e.initials}</div>
        <div class="reader-from"><div class="name">${e.sender}</div><div class="meta">komu: mně &nbsp;•&nbsp; dnes ${e.time}</div></div></div>
      <div class="reader-body">${e.body}</div>`;
  }
  function postaHTML(){
    const unread=emails.filter(e=>e.unread).length;
    return `<div class="mailapp"><div class="app-title">📧 Pošta <span class="search">🔍&nbsp; Hledat v e-mailech</span></div>
      <div class="mail-body">
        <nav class="folders"><button class="compose">✏️&nbsp; Nový e-mail</button>
          <ul><li class="active">📥 Doručená pošta ${unread?`<span class="cnt">${unread}</span>`:''}</li>
          <li>📤 Odeslaná pošta</li><li>📄 Koncepty</li><li>🗑️ Koš</li><li>🚫 Nevyžádaná pošta</li></ul></nav>
        <section class="list"><div class="list-head">Doručená pošta</div>${listHTML()}</section>
        <section class="reader">${readerHTML()}</section>
      </div></div>`;
  }

  /* ---------- Počasí ---------- */
  function pocasiHTML(){
    const cards=FORECAST.map(f=>`<div class="fc-card"><div class="ft">${f.t}</div><div class="fi">${f.ic}</div><div class="fp">${f.temp}</div><div class="fd">${f.d}</div></div>`).join("");
    const sum=SLOTS.map(s=>`<div class="ss"><div class="sn">${s.ic} ${s.name}</div><div class="si">${s.wIc}</div><div class="sw">${s.wLbl} (${s.hoursLbl})</div></div>`).join("");
    return `<div class="appwin"><div class="app-title">🌤️ Počasí — Paříž</div>
      <div class="pocasi">
        <h2>Předpověď na dnešek</h2>
        <p class="sub">Hodinová předpověď počasí v Paříži.</p>
        <div class="fc-row">${cards}</div>
        <h2 style="margin-top:20px;font-size:15px">Souhrn podle denní doby</h2>
        <div class="slot-sum">${sum}</div>
      </div></div>`;
  }

  /* ---------- Plánovač ---------- */
  function acardHTML(a, inSlot){
    const wCls=a.weather==="slunecno"?"sun":"any";
    const wTxt=a.weather==="slunecno"?"☀️ jen za hezka":"🏠 za každého počasí";
    const partBadges=a.parts.map(p=>`<span class="b">${slotById(p).name}</span>`).join("");
    const btns = inSlot
      ? `<div class="a-btns"><button data-place="${a.id}:pool">↩ zpět k aktivitám</button></div>`
      : `<div class="a-btns">${SLOTS.map(s=>`<button data-place="${a.id}:${s.id}">→ ${s.name}</button>`).join("")}</div>`;
    const meta = inSlot ? "" : `<div class="a-meta">${partBadges}<span class="b ${wCls}">${wTxt}</span></div>`;
    return `<div class="acard ${inSlot?'in-slot':''} ${wrongIds.includes(a.id)?'wrong':''}" draggable="true" data-actid="${a.id}">
      <div class="a-top"><span class="a-ic">${a.ic}</span><span>${a.name}</span></div>${meta}${btns}</div>`;
  }
  function planHTML(){
    if(solved){
      const sum=SLOTS.map(s=>{ const a=ACTS.find(x=>placement[x.id]===s.id); return `<div class="ps-row"><b>${s.ic} ${s.name}</b><span>${a?a.ic+" "+a.name:"—"}</span></div>`; }).join("");
      return `<div class="appwin"><div class="app-title">🗺️ Plánovač výletu</div>
        <div class="plan"><div class="result"><div class="big">🎉🗺️</div><h2>Máš hotový plán dne!</h2>
          <p>A tím jsi <strong>dokončil(a) celou cestu Malého cestovatele</strong>. Skvělá práce! 👏</p>
          <div class="plan-summary">${sum}</div>
          <a class="continue" href="../../../index.html">🏁 Zpět na začátek</a></div></div></div>`;
    }
    const slots=SLOTS.map(s=>{
      const acts=ACTS.filter(a=>placement[a.id]===s.id);
      const inner = acts.length? acts.map(a=>acardHTML(a,true)).join("")
        : `<div class="slot-drop empty" data-zone="${s.id}">Sem přetáhni aktivitu</div>`;
      const body = acts.length? `<div class="slot-drop" data-zone="${s.id}">${inner}</div>` : inner;
      return `<div class="slot"><div class="slot-head"><span class="sh-ic">${s.ic}</span><span class="sh-name">${s.name}</span><span class="sh-w">${s.wIc} ${s.wLbl}</span></div>${body}</div>`;
    }).join("");
    const pool=ACTS.filter(a=>placement[a.id]==="pool").map(a=>acardHTML(a,false)).join("");
    return `<div class="appwin"><div class="app-title">🗺️ Plánovač výletu <span class="search">Přetáhni aktivity do plánu</span></div>
      <div class="plan">
        <h2 class="sec">Plán dne — přetáhni aktivity do správné denní doby</h2>
        <div class="slots">${slots}</div>
        <div class="pool"><strong>Aktivity k výběru</strong><div class="pool-grid" data-zone="pool">${pool||'<span style="color:#999">Všechny aktivity jsou v plánu.</span>'}</div></div>
        <div class="plan-actions"><button class="btn btn-primary" data-check="1">✅ Zkontrolovat plán</button><span id="pfb"></span></div>
      </div></div>`;
  }

  /* ---------- nápověda ---------- */
  const HINTS=[
    `<b>Nápověda 1</b><p>Každá aktivita se hodí jen na určitou <strong>denní dobu</strong> (ráno / odpoledne / večer). Dej ji do správného sloupce — poznáš to podle štítků na kartičce.</p>`,
    `<b>Nápověda 2</b><p>Podívej se do aplikace <strong>Počasí 🌤️</strong>. Aktivity <strong>venku</strong> (☀️ jen za hezka) nejdou, když prší.</p>`,
    `<b>Nápověda 3</b><p>Odpoledne <strong>prší</strong> 🌧️ — na odpoledne naplánuj něco <strong>uvnitř</strong> (🏠 za každého počasí), třeba galerii nebo nákupy.</p>`
  ];
  function napovedaHTML(){
    const cards=HINTS.slice(0,hintLevel).map(h=>`<div class="hint-card">${h}</div>`).join("");
    const btn=hintLevel<HINTS.length?`<button class="reveal-btn" id="revealHint">${hintLevel===0?'Zobrazit nápovědu':'Další nápověda'}</button>`:`<p class="all-shown">To je vše. Teď to zkus! 😊</p>`;
    return `<div class="appwin"><div class="app-title">💡 Nápověda</div>
      <div class="napoveda"><div class="np-wrap"><p class="np-intro">Nevíš si rady s plánem? Odkrývej nápovědy postupně.</p>${cards}${btn}</div></div></div>`;
  }

  /* ---------- render ---------- */
  function renderScreen(){
    document.getElementById("screen").innerHTML =
      app==="plocha"?plochaHTML():app==="posta"?postaHTML():app==="pocasi"?pocasiHTML():app==="planovac"?planHTML():napovedaHTML();
  }
  function render(){ renderRail(); renderScreen(); }
  function openApp(id){
    if(id==="posta" && !mailRead){ mailRead=true; const m=emails.find(e=>e.id==="marco"); if(m) m.unread=false; }
    app=id; render();
  }
  function selectEmail(id){ const e=emails.find(x=>x.id===id); if(e&&e.unread) e.unread=false; currentId=id; renderScreen(); }
  function planMsg(html,cls){ const fb=document.getElementById("pfb"); if(fb) fb.innerHTML=`<span class="${cls||''}">${html}</span>`; }

  function place(id,zone){
    if(solved) return;
    if(zone!=="pool"){ // v časové době smí být jen jedna aktivita — tu původní vrať do seznamu
      ACTS.forEach(a=>{ if(a.id!==id && placement[a.id]===zone) placement[a.id]="pool"; });
    }
    placement[id]=zone; wrongIds=[]; renderScreen();
  }

  function checkPlan(){
    const errors=[]; const wrong=[];
    SLOTS.forEach(s=>{
      const acts=ACTS.filter(a=>placement[a.id]===s.id);
      if(acts.length===0){ errors.push(`Na <strong>${s.name.toLowerCase()}</strong> nemáš naplánováno nic.`); return; }
      acts.forEach(a=>{
        if(!a.parts.includes(s.id)){ errors.push(`<strong>${a.name}</strong> se nehodí na ${s.name.toLowerCase()} — dělá se jindy.`); wrong.push(a.id); }
        else if(a.weather==="slunecno" && s.weather!=="slunecno"){ errors.push(`<strong>${a.name}</strong> je venku a potřebuje hezké počasí, ale ${s.name.toLowerCase()} prší. 🌧️`); wrong.push(a.id); }
      });
    });
    if(errors.length===0){ solved=true; render(); return; }
    wrongIds=wrong; renderScreen();
    planMsg(`V plánu je ještě chyba:<ul>${errors.slice(0,4).map(e=>`<li>${e}</li>`).join("")}</ul>`,"err");
  }

  /* ---------- eventy ---------- */
  document.addEventListener("click", e=>{
    const railBtn=e.target.closest("[data-app]"); if(railBtn){ openApp(railBtn.dataset.app); return; }
    const row=e.target.closest("[data-mail]"); if(row){ selectEmail(row.dataset.mail); return; }
    if(e.target.id==="revealHint"){ if(hintLevel<HINTS.length){hintLevel++; renderScreen();} return; }
    const pl=e.target.closest("[data-place]"); if(pl){ const[id,z]=pl.dataset.place.split(":"); place(id,z); return; }
    if(e.target.closest("[data-check]")){ checkPlan(); return; }
  });
  document.addEventListener("dragstart", e=>{ const c=e.target.closest("[data-actid]"); if(c) e.dataTransfer.setData("text/plain",c.dataset.actid); });
  document.addEventListener("dragover", e=>{ if(e.target.closest("[data-zone]")) e.preventDefault(); });
  document.addEventListener("drop", e=>{ const z=e.target.closest("[data-zone]"); if(z){ e.preventDefault(); const id=e.dataTransfer.getData("text/plain"); if(id) place(id,z.dataset.zone); } });

  render();
</script>
</body>
</html>

<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Úkol 4 – Stihni nástup | Malý cestovatel</title>
<style>
  :root{
    --accent:#0f6cbd; --accent-dark:#115ea3;
    --app-bg:#faf9f8; --border:#edebe9; --border-strong:#e1dfdd;
    --text:#242424; --text-2:#616161; --unread:#0f6cbd;
    --sel:#e9f0f8; --sel-strong:#cfe4fa;
    --ok:#107c10; --err:#d13438; --rail:#223049; --rail-2:#2c3e5e;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{margin:0;font-family:"Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
    color:var(--text);background:#f3f2f1;display:flex;flex-direction:column;height:100vh;overflow:hidden;}

  .game-bar{flex:0 0 auto;height:52px;background:#fff;border-bottom:1px solid var(--border-strong);
    display:flex;align-items:center;justify-content:space-between;padding:0 18px;box-shadow:0 1px 3px rgba(0,0,0,.04);z-index:5;}
  .game-bar .brand{font-weight:700;font-size:16px;}
  .game-bar .brand .plane{margin-right:6px;}
  .game-bar .task-name{color:var(--text-2);font-size:14px;}
  .progress-pill{background:var(--accent);color:#fff;font-size:13px;font-weight:600;padding:5px 12px;border-radius:999px;}

  .os-body{flex:1;display:flex;min-height:0;}
  .rail{flex:0 0 190px;background:var(--rail);color:#eaeef6;display:flex;flex-direction:column;gap:6px;padding:14px 10px;}
  .rail .rail-title{font-size:12px;letter-spacing:.5px;text-transform:uppercase;color:#8ea2c4;padding:4px 10px 10px;}
  .rail-app{display:flex;align-items:center;gap:12px;width:100%;background:transparent;border:none;color:#eaeef6;
    padding:11px 12px;border-radius:10px;cursor:pointer;font-size:15px;text-align:left;font-family:inherit;}
  .rail-app:hover{background:var(--rail-2);}
  .rail-app.active{background:var(--accent);color:#fff;}
  .rail-app .ri{font-size:20px;width:24px;text-align:center;}
  .rail-app.glow{box-shadow:0 0 0 0 rgba(255,196,0,.7);animation:glowpulse 1.8s infinite;}
  @keyframes glowpulse{0%{box-shadow:0 0 0 0 rgba(255,196,0,.75);}70%{box-shadow:0 0 0 12px rgba(255,196,0,0);}100%{box-shadow:0 0 0 0 rgba(255,196,0,0);}}

  .screen{flex:1;min-width:0;position:relative;overflow:hidden;background:#fff;}

  .desktop{height:100%;width:100%;background:linear-gradient(160deg,#9ed0ff 0%,#6aa9e9 45%,#4f8fd6 100%);padding:26px;position:relative;}
  .desktop .plane-deco{position:absolute;right:40px;top:30px;font-size:54px;transform:rotate(-8deg);opacity:.9;}
  .desk-grid{display:grid;grid-template-columns:repeat(auto-fill,96px);gap:18px 14px;align-content:start;}
  .desk-icon{width:96px;background:transparent;border:none;cursor:pointer;display:flex;flex-direction:column;align-items:center;
    gap:7px;padding:8px 4px;border-radius:10px;font-family:inherit;color:#0a2a4d;}
  .desk-icon .di{width:60px;height:60px;border-radius:14px;background:#fff;display:flex;align-items:center;justify-content:center;
    font-size:30px;box-shadow:0 4px 10px rgba(0,0,0,.18);}
  .desk-icon .dl{font-size:13px;font-weight:600;color:#06264a;background:rgba(255,255,255,.55);padding:1px 7px;border-radius:6px;}
  .desk-icon:hover:not(.disabled){background:rgba(255,255,255,.22);}
  .desk-icon.disabled{cursor:default;opacity:.65;}
  .desk-icon.glow .di{animation:glowpulse 1.8s infinite;}
  .start-here{margin-top:2px;font-size:11px;font-weight:700;color:#fff;background:#e8820c;padding:3px 8px;border-radius:999px;white-space:nowrap;box-shadow:0 2px 6px rgba(0,0,0,.2);}

  .appwin,.mailapp{display:flex;flex-direction:column;height:100%;}
  .app-title{flex:0 0 auto;height:46px;background:var(--accent);color:#fff;display:flex;align-items:center;gap:16px;padding:0 16px;font-weight:600;font-size:15px;}
  .app-title .clock-pill{margin-left:auto;background:rgba(255,255,255,.18);border-radius:6px;padding:5px 12px;font-size:15px;font-weight:700;font-variant-numeric:tabular-nums;}

  /* mail */
  .mail-body{flex:1;display:flex;min-height:0;}
  .folders{flex:0 0 210px;background:var(--app-bg);border-right:1px solid var(--border);padding:12px 8px;overflow-y:auto;}
  .compose{width:100%;border:1px solid var(--border-strong);background:#fff;color:var(--accent);font-weight:600;font-size:14px;padding:9px 12px;border-radius:6px;cursor:pointer;margin-bottom:12px;text-align:left;font-family:inherit;}
  .folders ul{list-style:none;margin:0;padding:0;}
  .folders li{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:6px;font-size:14px;color:var(--text);}
  .folders li .cnt{margin-left:auto;color:var(--text-2);font-size:12px;font-weight:600;}
  .folders li.active{background:var(--sel-strong);font-weight:600;}
  .list{flex:0 0 340px;background:#fff;border-right:1px solid var(--border);overflow-y:auto;}
  .list-head{padding:12px 16px;font-weight:700;font-size:16px;border-bottom:1px solid var(--border);position:sticky;top:0;background:#fff;}
  .email-row{display:flex;gap:12px;padding:12px 16px 12px 12px;border-bottom:1px solid var(--border);cursor:pointer;border-left:3px solid transparent;}
  .email-row:hover{background:#f5f9fd;}
  .email-row.selected{background:var(--sel);border-left-color:var(--accent);}
  .email-row.unread{border-left-color:var(--unread);}
  .email-main{flex:1;min-width:0;}
  .email-line1{display:flex;align-items:center;gap:8px;}
  .email-sender{font-size:14px;}
  .email-row.unread .email-sender{font-weight:700;}
  .email-time{margin-left:auto;font-size:12px;color:var(--text-2);white-space:nowrap;}
  .email-subject{font-size:13px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .email-row.unread .email-subject{font-weight:600;color:var(--accent-dark);}
  .email-preview{font-size:12px;color:var(--text-2);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .dot{flex:0 0 8px;height:8px;border-radius:50%;background:var(--unread);align-self:center;}
  .dot.hidden{visibility:hidden;}
  .reader{flex:1;background:#fff;overflow-y:auto;padding:24px 32px;min-width:0;}
  .reader .subject{font-size:21px;font-weight:600;margin:0 0 14px;}
  .reader-head{display:flex;gap:12px;align-items:center;padding-bottom:16px;border-bottom:1px solid var(--border);margin-bottom:18px;}
  .reader-head .avatar{flex:0 0 40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-size:14px;font-weight:600;}
  .reader-from .name{font-weight:600;font-size:14px;}
  .reader-from .meta{font-size:12px;color:var(--text-2);}
  .reader-body{font-size:15px;line-height:1.6;max-width:720px;}
  .reader-body p{margin:0 0 12px;}

  /* ---- Odlety ---- */
  .gate-body{flex:1;display:flex;min-height:0;}
  .side{flex:0 0 260px;background:var(--app-bg);border-right:1px solid var(--border);padding:16px;overflow-y:auto;}
  .side h3{margin:0 0 8px;font-size:12px;text-transform:uppercase;letter-spacing:.4px;color:var(--text-2);}
  .clock-card{background:#0c1b33;color:#fff;border-radius:12px;padding:14px 16px;text-align:center;margin-bottom:14px;}
  .clock-card .lbl{font-size:12px;color:#8fb3e8;text-transform:uppercase;letter-spacing:.5px;}
  .clock-card .clock{font-size:40px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.1;}
  .tick-card{background:#fff;border:1px solid var(--border-strong);border-radius:10px;padding:12px 14px;font-size:13.5px;margin-bottom:14px;}
  .tick-card .bc-title{font-weight:700;margin-bottom:6px;}
  .tick-card .row{display:flex;justify-content:space-between;gap:8px;margin:3px 0;}
  .tick-card .k{color:var(--text-2);}
  .side .tip{font-size:13px;color:var(--text-2);}

  .gate-main{flex:1;overflow:auto;padding:18px 22px;background:#f5f6f8;}
  .gate-main h2.sec{font-size:15px;margin:0 0 10px;}

  .board{width:100%;border-collapse:collapse;background:#0c1b33;color:#e8eefc;border-radius:10px;overflow:hidden;font-size:14px;box-shadow:0 3px 12px rgba(0,0,0,.15);}
  .board th{background:#09152a;color:#8fb3e8;text-transform:uppercase;font-size:11px;letter-spacing:.5px;padding:9px 10px;text-align:left;}
  .board td{padding:9px 10px;border-top:1px solid #1b2c49;white-space:nowrap;}
  .board tr.mine td{background:#13294d;}
  .board .num{font-weight:700;}
  .tag-mine{background:#e8820c;color:#fff;font-size:10px;font-weight:700;padding:1px 6px;border-radius:4px;margin-left:6px;}
  .st{font-weight:700;font-size:12px;padding:3px 9px;border-radius:999px;display:inline-block;}
  .st.wait{background:#33425e;color:#c7d3ea;}
  .st.boarding{background:#1f7a2b;color:#fff;}
  .st.final{background:#b26a00;color:#fff;}
  .st.closed{background:#8a2a2d;color:#fff;}
  .st.gone{background:#3a3a3a;color:#c9c9c9;}

  .acts{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:10px;margin:6px 0 4px;}
  .act{display:flex;align-items:center;gap:9px;padding:11px 12px;border:1px solid var(--border-strong);border-radius:10px;background:#fff;cursor:pointer;font-size:14px;font-family:inherit;text-align:left;}
  .act:hover{border-color:var(--accent);background:#eef4fb;}
  .act .ai{font-size:18px;}
  .act .m{margin-left:auto;color:var(--text-2);font-size:12.5px;white-space:nowrap;}
  .go-row{margin-top:16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;}
  .btn{padding:11px 20px;font-size:15px;font-weight:600;border-radius:8px;cursor:pointer;border:1px solid transparent;font-family:inherit;}
  .btn-primary{background:var(--accent);color:#fff;} .btn-primary:hover{background:var(--accent-dark);}
  .btn-go{background:#e8820c;color:#fff;} .btn-go:hover{background:#cf7109;}
  .btn-ghost{background:#fff;color:var(--text-2);border:1px solid var(--border-strong);}
  #afb{font-size:13.5px;color:var(--text-2);}

  .gate-view{max-width:560px;margin:10px auto;background:#fff;border:1px solid var(--border-strong);border-radius:14px;padding:26px;text-align:center;box-shadow:0 2px 10px rgba(0,0,0,.06);}
  .gate-view .gnum{font-size:40px;font-weight:800;color:var(--accent-dark);}
  .gate-view .big-st{margin:12px 0 18px;}
  .gate-view .big-st .st{font-size:15px;padding:6px 14px;}
  .gate-view p{font-size:14px;color:var(--text);margin:4px 0 14px;}
  .gate-actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;}
  .gate-picker{display:flex;flex-wrap:wrap;gap:10px;margin:6px 0 2px;}
  .gatebtn{padding:12px 20px;font-size:16px;font-weight:700;border:2px solid var(--border-strong);border-radius:10px;background:#fff;cursor:pointer;font-family:inherit;color:var(--accent-dark);}
  .gatebtn:hover{border-color:var(--accent);background:#eef4fb;}

  .bpass{max-width:460px;margin:0 auto;background:#fff;border:1px solid var(--border-strong);border-radius:16px;overflow:hidden;box-shadow:0 6px 20px rgba(0,0,0,.08);}
  .bp-top{background:var(--accent);color:#fff;padding:14px 20px;font-weight:700;font-size:15px;display:flex;justify-content:space-between;}
  .bp-body{padding:16px 20px;}
  .bp-route{font-size:19px;font-weight:700;margin:4px 0 12px;text-align:center;color:var(--accent-dark);}
  .bp-row{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px dashed var(--border);font-size:14px;}
  .bp-row:last-child{border-bottom:none;}
  .bp-row .k{color:var(--text-2);}

  .result{max-width:560px;margin:30px auto;text-align:center;background:#fff;border-radius:16px;padding:32px;box-shadow:0 6px 24px rgba(0,0,0,.08);}
  .result.ok{border:1px solid #bfe3bf;} .result.bad{border:1px solid #f3c6c7;}
  .result .big{font-size:54px;} .result.ok h2{color:var(--ok);margin:10px 0 6px;} .result.bad h2{color:var(--err);margin:10px 0 6px;}
  .result p{font-size:15px;margin:4px 0;}
  .continue{display:inline-block;margin-top:16px;background:var(--ok);color:#fff;text-decoration:none;padding:12px 24px;border-radius:8px;font-weight:600;font-size:15px;}
  .continue:hover{background:#0b5e0b;}
  .btn-restart{margin-top:16px;background:var(--accent);color:#fff;border:none;padding:12px 24px;border-radius:8px;font-weight:600;font-size:15px;cursor:pointer;font-family:inherit;}

  .napoveda{flex:1;overflow-y:auto;padding:28px 32px;background:#fafafa;}
  .napoveda .np-wrap{max-width:620px;margin:0 auto;}
  .np-intro{font-size:14px;color:var(--text-2);background:#eef4fb;border:1px solid #cfe0f3;padding:12px 14px;border-radius:8px;margin:0 0 18px;}
  .hint-card{background:#fff;border:1px solid var(--border-strong);border-left:4px solid #e8a30c;border-radius:8px;padding:14px 16px;margin-bottom:14px;}
  .hint-card b{display:block;font-size:12px;letter-spacing:.4px;text-transform:uppercase;color:#b8790a;margin-bottom:6px;}
  .hint-card p{margin:0;font-size:15px;line-height:1.55;}
  .reveal-btn{background:#e8820c;color:#fff;border:none;padding:11px 20px;border-radius:8px;font-size:15px;font-weight:600;cursor:pointer;font-family:inherit;}
  .reveal-btn:hover{background:#cf7109;}
  .all-shown{font-size:13px;color:var(--text-2);}

  @media (max-width:1050px){ .folders{display:none;} }
  @media (max-width:1050px){ .gate-body{flex-direction:column;} .side{flex:0 0 auto;border-right:none;border-bottom:1px solid var(--border);} }
  @media (max-width:860px){
    .rail{flex:0 0 64px;} .rail .rail-title,.rail-app .rl{display:none;} .rail-app{justify-content:center;}
    .mail-body{flex-direction:column;}
    .list{flex:0 0 auto;max-height:34vh;border-right:none;border-bottom:1px solid var(--border);}
    .board{font-size:12.5px;} .board th,.board td{padding:7px 7px;}
  }
</style>
</head>
<body>

  <div class="game-bar">
    <div class="brand"><span class="plane">✈️</span>Malý cestovatel</div>
    <div class="task-name">Úkol 4 — Stihni nástup k bráně</div>
    <div class="progress-pill">Úkol 4&nbsp;/&nbsp;7</div>
  </div>

  <div class="os-body">
    <nav class="rail" id="rail"></nav>
    <main class="screen" id="screen"></main>
  </div>

<script>
  /* ---------- čas v minutách od 00:00 ---------- */
  const fmt=m=>`${Math.floor(m/60)}:${String(m%60).padStart(2,"0")}`;
  const WALK=10;
  const START=600; // 10:00

  /* ---------- odletová tabule ---------- */
  const FLIGHTS=[
    {num:"FR-88",  depLbl:"10:50", dest:"Řím",   gate:"A1",  board:620, close:645, depart:650},
    {num:"IA-204", depLbl:"11:00", dest:"Londýn", gate:"A3",  board:630, close:655, depart:660},
    {num:"OK-512", depLbl:"11:20", dest:"Vídeň", gate:"B10", board:650, close:675, depart:680},
    {num:"IA-118", depLbl:"11:40", dest:"Vídeň", gate:"B12", board:670, close:695, depart:700, mine:true},
    {num:"LH-330", depLbl:"12:15", dest:"Londýn", gate:"C7",  board:705, close:730, depart:735}
  ];
  const MINE=FLIGHTS.find(f=>f.mine);
  const GATES=["A1","A3","B5","B10","B12","C2","C7"]; // brány z tabule + i takové, co na letišti nejsou
  const flightAtGate=g=>FLIGHTS.find(f=>f.gate===g);

  function statusOf(f,now){
    if(now>=f.depart) return {t:"Odletěl", cls:"gone"};
    if(now>=f.close)  return {t:"Brána uzavřena", cls:"closed"};
    if(now>=f.close-5)return {t:"Poslední výzva — "+f.gate, cls:"final"};
    if(now>=f.board)  return {t:"Nástup — "+f.gate, cls:"boarding"};
    return {t:"Čekejte", cls:"wait"};
  }

  const ACTS=[
    {id:"food", ic:"🍔", label:"Rychlé občerstvení", min:25},
    {id:"duty", ic:"🛍️", label:"Duty free",          min:20},
    {id:"cafe", ic:"☕", label:"Kavárna",             min:15},
    {id:"view", ic:"📸", label:"Vyhlídka na letadla", min:15},
    {id:"rest", ic:"🪑", label:"Posedět a odpočívat", min:10},
    {id:"wc",   ic:"🚻", label:"Toaleta",             min:5}
  ];

  /* ---------- stav ---------- */
  let app="plocha";
  let currentId="board-mail";
  let mailRead=false;
  let hintLevel=0;
  let now=START;
  let loc="hala";       // "hala" | "brana"
  let pickedGate=null;
  let boarded=false;
  let lastMsg="";
  const missed=()=>!boarded && now>=MINE.close;

  /* ---------- e-maily ---------- */
  const emails=[
    { id:"board-mail", unread:true, sender:"Imaginarium Airlines", initials:"✈", color:"#0f6cbd",
      subject:"Čas k odletu — sleduj tabuli! ✈️", time:"9:58",
      preview:"Tvůj let IA-118 brzy odlétá. Najdi si bránu na tabuli…",
      body:`<p>Vážený cestující,</p>
        <p>blíží se čas odletu. Letíš <strong>s přestupem</strong> — máš <strong>dvě letenky</strong> (v aplikaci <strong>Aerolinky ✈️</strong>): nejdřív z Prahy do <strong>Vídně</strong>, pak z Vídně do Londýna.</p>
        <p>Teď v Praze nastupuješ na <strong>první let — do Vídně</strong> (pozor, ne přímo do Londýna!). V aplikaci <strong>Odlety</strong> 🛫 si na tabuli sám(sama) najdi let <strong>IA-118</strong>, zjisti <strong>bránu</strong> a sleduj <strong>stav nástupu</strong>. Čekání si zkrať aktivitami, ale ke správné bráně dojdi <strong>včas</strong>, ať ti letadlo neuletí!</p>
        <p>Příjemný let! ✈️</p>` },
    { id:"marco", unread:false, sender:"Marco", initials:"M", color:"#b4009e",
      subject:"Tak už letíš? 🤩", time:"po",
      preview:"Napiš, až budeš v letadle…",
      body:`<p>Ahoj! Doufám, že stihneš nástup. Napiš, až budeš sedět v letadle! Marco</p>` }
  ];

  const apps=[
    {id:"plocha",icon:"🖥️",label:"Plocha"},{id:"posta",icon:"📧",label:"Pošta"},
    {id:"odlety",icon:"🛫",label:"Odlety"},{id:"airlines",icon:"✈️",label:"Aerolinky"},{id:"napoveda",icon:"💡",label:"Nápověda"}
  ];

  /* ---------- rail ---------- */
  function renderRail(){
    document.getElementById("rail").innerHTML=`<div class="rail-title">Aplikace</div>`+
      apps.map(a=>{ let glow="";
        if(a.id==="posta" && !mailRead) glow="glow";
        if(a.id==="odlety" && mailRead && !boarded) glow="glow";
        return `<button class="rail-app ${app===a.id?'active':''} ${glow}" data-app="${a.id}"><span class="ri">${a.icon}</span><span class="rl">${a.label}</span></button>`;
      }).join("");
  }

  /* ---------- plocha ---------- */
  function plochaHTML(){
    const pg=!mailRead, og=mailRead&&!boarded;
    const posta=`<button class="desk-icon ${pg?'glow':''}" data-app="posta"><span class="di">📧</span><span class="dl">Pošta</span>${pg?'<span class="start-here">Nový e-mail 👆</span>':''}</button>`;
    const odlety=`<button class="desk-icon ${og?'glow':''}" data-app="odlety"><span class="di">🛫</span><span class="dl">Odlety</span>${og?'<span class="start-here">Ke bráně 👆</span>':''}</button>`;
    const airlines=`<button class="desk-icon" data-app="airlines"><span class="di">✈️</span><span class="dl">Aerolinky</span></button>`;
    const napo=`<button class="desk-icon" data-app="napoveda"><span class="di">💡</span><span class="dl">Nápověda</span></button>`;
    const deco=["🗑️ Koš","🌐 Prohlížeč"].map(d=>{const[i,...n]=d.split(" ");return `<div class="desk-icon disabled"><span class="di">${i}</span><span class="dl">${n.join(" ")}</span></div>`;}).join("");
    return `<div class="desktop"><div class="plane-deco">🛫</div><div class="desk-grid">${posta}${odlety}${airlines}${napo}${deco}</div></div>`;
  }

  /* ---------- Aerolinky (letenka) ---------- */
  function bpassHTML(leg, from, to, num, odlet, seat, note){
    return `<div class="bpass">
      <div class="bp-top"><span>✈️ Imaginarium Airlines</span><span>Palubní lístek ${leg}/2</span></div>
      <div class="bp-body">
        <div class="bp-route">${from} → ${to}</div>
        <div class="bp-row"><span class="k">Cestující</span><span>TY</span></div>
        <div class="bp-row"><span class="k">Let</span><span><strong>${num}</strong></span></div>
        <div class="bp-row"><span class="k">Datum</span><span>sobota 11. 7. 2026</span></div>
        <div class="bp-row"><span class="k">Odlet</span><span>${odlet}</span></div>
        <div class="bp-row"><span class="k">Sedadlo</span><span>${seat}</span></div>
        <div class="bp-row"><span class="k">Brána</span><span>dle odletové tabule</span></div>
      </div>
      ${note?`<div style="padding:10px 18px;background:#fff7e6;border-top:1px solid #f0dca0;font-size:13px;color:#8a6d00">${note}</div>`:""}
    </div>`;
  }
  function airlinesHTML(){
    return `<div class="appwin"><div class="app-title">✈️ Imaginarium Airlines<span class="clock-pill">🕐 ${fmt(now)}</span></div>
      <div style="flex:1;overflow:auto;background:#f5f6f8;padding:22px;">
        <p style="max-width:480px;margin:0 auto 14px;font-size:14px;color:#444;text-align:center">Letíš <strong>s přestupem</strong> — máš <strong>dvě letenky</strong>. Nejdřív z Prahy do Vídně, pak z Vídně do Londýna.</p>
        <div style="display:flex;flex-wrap:wrap;gap:18px;justify-content:center">
          ${bpassHTML(1,"Praha","Vídeň","IA-118","11:40","14C","1. let — teď v Praze. Nastupuješ do letadla do Vídně.")}
          ${bpassHTML(2,"Vídeň","Londýn","IA-412","14:05","9A","2. let — až po přestupu ve Vídni.")}
        </div>
      </div></div>`;
  }

  /* ---------- mail ---------- */
  function listHTML(){
    return emails.map(e=>`
      <div class="email-row ${e.unread?'unread':''} ${e.id===currentId?'selected':''}" data-mail="${e.id}">
        <div style="background:${e.color};flex:0 0 36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:600;font-size:14px">${e.initials}</div>
        <div class="email-main">
          <div class="email-line1"><span class="email-sender">${e.sender}</span><span class="email-time">${e.time}</span></div>
          <div class="email-subject">${e.subject}</div><div class="email-preview">${e.preview}</div>
        </div><div class="dot ${e.unread?'':'hidden'}"></div></div>`).join("");
  }
  function readerHTML(){
    const e=emails.find(x=>x.id===currentId);
    return `<div class="subject">${e.subject}</div>
      <div class="reader-head"><div class="avatar" style="background:${e.color}">${e.initials}</div>
        <div class="reader-from"><div class="name">${e.sender}</div><div class="meta">komu: mně &nbsp;•&nbsp; dnes ${e.time}</div></div></div>
      <div class="reader-body">${e.body}</div>`;
  }
  function postaHTML(){
    const unread=emails.filter(e=>e.unread).length;
    return `<div class="mailapp"><div class="app-title">📧 Pošta<span class="clock-pill">🕐 ${fmt(now)}</span></div>
      <div class="mail-body">
        <nav class="folders"><button class="compose">✏️&nbsp; Nový e-mail</button>
          <ul><li class="active">📥 Doručená pošta ${unread?`<span class="cnt">${unread}</span>`:''}</li>
          <li>📤 Odeslaná pošta</li><li>📄 Koncepty</li><li>🗑️ Koš</li><li>🚫 Nevyžádaná pošta</li></ul></nav>
        <section class="list"><div class="list-head">Doručená pošta</div>${listHTML()}</section>
        <section class="reader">${readerHTML()}</section>
      </div></div>`;
  }

  /* ---------- Odlety ---------- */
  function boardHTML(){
    const rows=FLIGHTS.map(f=>{ const s=statusOf(f,now);
      return `<tr>
        <td>${f.depLbl}</td><td class="num">${f.num}</td>
        <td>${f.dest}</td><td>${f.gate}</td>
        <td><span class="st ${s.cls}">${s.t}</span></td></tr>`;
    }).join("");
    return `<table class="board"><thead><tr><th>Odlet</th><th>Let</th><th>Cíl</th><th>Brána</th><th>Stav</th></tr></thead><tbody>${rows}</tbody></table>`;
  }
  function sideHTML(){
    return `<div class="side">
      <h3>Aktuální čas</h3>
      <div class="clock-card"><div class="lbl">Hodiny na letišti</div><div class="clock">${fmt(now)}</div></div>
      <h3>Můj 1. let (z Prahy)</h3>
      <div class="tick-card"><div class="bc-title">✈️ ${MINE.num}</div>
        <div class="row"><span class="k">Trasa</span><span>Praha → Vídeň</span></div>
        <div class="row"><span class="k">Cestující</span><span>TY</span></div>
        <div class="row"><span class="k">Odlet</span><span>11:40</span></div>
        <div class="row"><span class="k">Brána</span><span>dle tabule</span></div>
      </div>
      <div class="tip">Letíš <strong>s přestupem</strong> — teď v Praze nastupuješ na let do <strong>Vídně</strong> (ne přímo do Londýna!). Najdi let <strong>${MINE.num}</strong> na tabuli, zjisti <strong>bránu</strong> a sleduj <strong>Stav</strong>. Cesta k bráně trvá <strong>${WALK} min</strong>. Obě letenky máš v aplikaci <strong>Aerolinky ✈️</strong>.</div>
    </div>`;
  }
  function halaMainHTML(){
    return `<h2 class="sec">🛫 Odletová tabule — Praha</h2>
      ${boardHTML()}
      <h2 class="sec" style="margin-top:22px">Máš ještě čas. Co budeš dělat?</h2>
      <div class="acts">${ACTS.map(a=>`<button class="act" data-act="${a.id}"><span class="ai">${a.ic}</span>${a.label}<span class="m">+${a.min} min</span></button>`).join("")}</div>
      <div id="afb" style="margin:10px 0 2px">${lastMsg}</div>
      <h2 class="sec" style="margin-top:14px">🚶 Vydej se k bráně — ke které jdeš? (cesta trvá ${WALK} min)</h2>
      <div class="gate-picker">${GATES.map(g=>`<button class="gatebtn" data-gogate="${g}">Brána ${g}</button>`).join("")}</div>`;
  }
  function gateCard(g,body,actions){
    return `<div class="gate-view">
        <div style="color:var(--text-2);font-size:13px">Jsi u brány &nbsp;•&nbsp; čas ${fmt(now)}</div>
        <div class="gnum">Brána ${g}</div>${body}
        <div class="gate-actions">${actions}</div></div>`;
  }
  function branaMainHTML(){
    const g=pickedGate, back=`<button class="btn btn-ghost" data-back="1">⬅ Zpět k tabuli (${WALK} min)</button>`;
    if(g!==MINE.gate){
      const f=flightAtGate(g);
      const msg=f?`U brány <strong>${g}</strong> odlétá let <strong>${f.num}</strong> do ${f.dest}. Tvůj let IA-118 tady není.`
                :`Brána <strong>${g}</strong> na letišti vůbec není. 🤷`;
      return gateCard(g,`<div class="big-st"><span class="st closed">Špatná brána</span></div><p>${msg}</p>`,back);
    }
    if(now<MINE.board){
      return gateCard(g,`<div class="big-st"><span class="st wait">Nástup ještě nezačal</span></div><p>Přišel(a) jsi moc brzy. Vrať se k tabuli a přijď, až bude <strong>Nástup</strong>.</p>`,back);
    }
    const s=statusOf(MINE,now);
    return gateCard(g,`<div style="font-size:14px;color:var(--text-2)">Let ${MINE.num} → Vídeň</div><div class="big-st"><span class="st ${s.cls}">${s.t}</span></div>`,
      `<button class="btn btn-primary" data-board="1">✈️ Nastoupit do letadla</button>${back}`);
  }
  function odletyHTML(){
    let main;
    if(boarded){
      main=`<div class="result ok"><div class="big">🛫✅</div><h2>Stihl(a) jsi to!</h2>
        <p>Nastoupil(a) jsi na let <strong>${MINE.num}</strong> u brány <strong>${MINE.gate}</strong> v ${fmt(now)}.</p>
        <p>Letíš do <strong>Vídně</strong> — odtud pak přestoupíš na let do Londýna.</p>
        <a class="continue" href="../05-vyber-hotelu/index.html">Pokračovat na další úkol →</a></div>`;
    } else if(missed()){
      main=`<div class="result bad"><div class="big">😟✈️</div><h2>Letadlo ti uletělo!</h2>
        <p>Brána ${MINE.gate} se zavřela v ${fmt(MINE.close)}. Teď je ${fmt(now)}.</p>
        <p>Trávil(a) jsi aktivitami moc času. Zkus to znovu a hlídej si čas nástupu!</p>
        <button class="btn-restart" data-restart="1">⟲ Zkusit znovu</button></div>`;
    } else if(loc==="brana"){
      main=branaMainHTML();
    } else {
      main=`<div class="gate-main">${halaMainHTML()}</div>`;
    }
    const wrapMain = (boarded||missed()||loc==="brana") ? `<div class="gate-main">${main}</div>` : main;
    return `<div class="appwin"><div class="app-title">🛫 Odlety<span class="clock-pill">🕐 ${fmt(now)}</span></div>
      <div class="gate-body">${sideHTML()}${wrapMain}</div></div>`;
  }

  /* ---------- nápověda ---------- */
  const HINTS=[
    `<b>Nápověda 1</b><p>Letíš s <strong>přestupem</strong>! V Praze nastupuješ na <strong>první let do Vídně</strong>, ne přímo do Londýna. Lety do Londýna na tabuli <strong>nejsou tvoje</strong> — nenech se nachytat.</p>`,
    `<b>Nápověda 2</b><p>Najdi na tabuli let <strong>IA-118</strong> (podle <strong>čísla letu</strong> z aplikace Aerolinky). Na tabuli je i jiný let do Vídně — ten taky není tvůj!</p>`,
    `<b>Nápověda 3</b><p>Přečti si <strong>bránu</strong> svého letu a jdi právě k té, až bude <em>Nástup</em>. Cesta trvá <strong>${WALK} min</strong>; špatná brána nebo brzký příchod tě vrátí k tabuli a ztrácíš čas.</p>`
  ];
  function napovedaHTML(){
    const cards=HINTS.slice(0,hintLevel).map(h=>`<div class="hint-card">${h}</div>`).join("");
    const btn=hintLevel<HINTS.length?`<button class="reveal-btn" id="revealHint">${hintLevel===0?'Zobrazit nápovědu':'Další nápověda'}</button>`:`<p class="all-shown">To je vše. Teď to zkus! 😊</p>`;
    return `<div class="appwin"><div class="app-title">💡 Nápověda</div>
      <div class="napoveda"><div class="np-wrap"><p class="np-intro">Nevíš si rady u brány? Odkrývej nápovědy postupně.</p>${cards}${btn}</div></div></div>`;
  }

  /* ---------- render ---------- */
  function renderScreen(){
    document.getElementById("screen").innerHTML =
      app==="plocha"?plochaHTML():app==="posta"?postaHTML():app==="odlety"?odletyHTML():app==="airlines"?airlinesHTML():napovedaHTML();
  }
  function render(){ renderRail(); renderScreen(); }
  function openApp(id){
    if(id==="posta" && !mailRead){ mailRead=true; const m=emails.find(e=>e.id==="board-mail"); if(m) m.unread=false; }
    app=id; render();
  }
  function selectEmail(id){ const e=emails.find(x=>x.id===id); if(e&&e.unread) e.unread=false; currentId=id; renderScreen(); }

  function doAct(id){
    if(loc!=="hala"||boarded||missed()) return;
    const a=ACTS.find(x=>x.id===id); if(!a) return;
    now+=a.min; lastMsg=`${a.ic} ${a.label} (+${a.min} min). Je ${fmt(now)}.`;
    render();
  }
  function goGate(g){ if(boarded||missed()) return; now+=WALK; loc="brana"; pickedGate=g; lastMsg=""; render(); }
  function backHall(){ if(boarded||missed()) return; now+=WALK; loc="hala"; render(); }
  function boardPlane(){ if(pickedGate===MINE.gate && now>=MINE.board && now<MINE.close){ boarded=true; } render(); }
  function restart(){ now=START; loc="hala"; pickedGate=null; boarded=false; lastMsg=""; render(); }

  document.addEventListener("click", e=>{
    const railBtn=e.target.closest("[data-app]"); if(railBtn){ openApp(railBtn.dataset.app); return; }
    const row=e.target.closest("[data-mail]"); if(row){ selectEmail(row.dataset.mail); return; }
    if(e.target.id==="revealHint"){ if(hintLevel<HINTS.length){hintLevel++; renderScreen();} return; }
    const act=e.target.closest("[data-act]"); if(act){ doAct(act.dataset.act); return; }
    const gg=e.target.closest("[data-gogate]"); if(gg){ goGate(gg.dataset.gogate); return; }
    if(e.target.closest("[data-back]")){ backHall(); return; }
    if(e.target.closest("[data-board]")){ boardPlane(); return; }
    if(e.target.closest("[data-restart]")){ restart(); return; }
  });

  render();
</script>
</body>
</html>

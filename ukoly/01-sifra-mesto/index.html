<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Úkol 1 – Tajné město | Malý cestovatel</title>
<style>
  :root{
    --accent:#0f6cbd;
    --accent-dark:#115ea3;
    --app-bg:#faf9f8;
    --border:#edebe9;
    --border-strong:#e1dfdd;
    --text:#242424;
    --text-2:#616161;
    --unread:#0f6cbd;
    --sel:#e9f0f8;
    --sel-strong:#cfe4fa;
    --ok:#107c10;
    --err:#d13438;
    --rail:#223049;
    --rail-2:#2c3e5e;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    font-family:"Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
    color:var(--text);
    background:#f3f2f1;
    display:flex;
    flex-direction:column;
    height:100vh;
    overflow:hidden;
  }

  /* ---- Game top bar ---- */
  .game-bar{
    flex:0 0 auto;height:52px;background:#fff;
    border-bottom:1px solid var(--border-strong);
    display:flex;align-items:center;justify-content:space-between;
    padding:0 18px;box-shadow:0 1px 3px rgba(0,0,0,.04);z-index:5;
  }
  .game-bar .brand{font-weight:700;font-size:16px;}
  .game-bar .brand .plane{margin-right:6px;}
  .game-bar .task-name{color:var(--text-2);font-size:14px;}
  .progress-pill{background:var(--accent);color:#fff;font-size:13px;font-weight:600;
    padding:5px 12px;border-radius:999px;}

  /* ---- OS layout ---- */
  .os-body{flex:1;display:flex;min-height:0;}

  /* app rail */
  .rail{
    flex:0 0 190px;background:var(--rail);color:#eaeef6;
    display:flex;flex-direction:column;gap:6px;padding:14px 10px;
  }
  .rail .rail-title{font-size:12px;letter-spacing:.5px;text-transform:uppercase;
    color:#8ea2c4;padding:4px 10px 10px;}
  .rail-app{
    display:flex;align-items:center;gap:12px;width:100%;
    background:transparent;border:none;color:#eaeef6;
    padding:11px 12px;border-radius:10px;cursor:pointer;
    font-size:15px;text-align:left;font-family:inherit;
  }
  .rail-app:hover{background:var(--rail-2);}
  .rail-app.active{background:var(--accent);color:#fff;}
  .rail-app .ri{font-size:20px;width:24px;text-align:center;}
  .rail-app.glow{box-shadow:0 0 0 0 rgba(255,196,0,.7);animation:glowpulse 1.8s infinite;}

  @keyframes glowpulse{
    0%{box-shadow:0 0 0 0 rgba(255,196,0,.75);}
    70%{box-shadow:0 0 0 12px rgba(255,196,0,0);}
    100%{box-shadow:0 0 0 0 rgba(255,196,0,0);}
  }

  /* screen */
  .screen{flex:1;min-width:0;position:relative;overflow:hidden;background:#fff;}

  /* ---- Plocha (desktop) ---- */
  .desktop{
    height:100%;width:100%;
    background:linear-gradient(160deg,#9ed0ff 0%,#6aa9e9 45%,#4f8fd6 100%);
    padding:26px;position:relative;
  }
  .desktop .plane-deco{position:absolute;right:40px;top:30px;font-size:54px;
    transform:rotate(-8deg);opacity:.9;}
  .desk-grid{display:grid;grid-template-columns:repeat(auto-fill,96px);
    gap:18px 14px;align-content:start;}
  .desk-icon{
    width:96px;background:transparent;border:none;cursor:pointer;
    display:flex;flex-direction:column;align-items:center;gap:7px;
    padding:8px 4px;border-radius:10px;font-family:inherit;color:#0a2a4d;
  }
  .desk-icon .di{
    width:60px;height:60px;border-radius:14px;background:#fff;
    display:flex;align-items:center;justify-content:center;font-size:30px;
    box-shadow:0 4px 10px rgba(0,0,0,.18);
  }
  .desk-icon .dl{font-size:13px;font-weight:600;color:#06264a;
    background:rgba(255,255,255,.55);padding:1px 7px;border-radius:6px;}
  .desk-icon:hover:not(.disabled){background:rgba(255,255,255,.22);}
  .desk-icon.disabled{cursor:default;opacity:.65;}
  .desk-icon.glow .di{animation:glowpulse 1.8s infinite;}
  .start-here{
    margin-top:2px;font-size:11px;font-weight:700;color:#fff;
    background:#e8820c;padding:3px 8px;border-radius:999px;white-space:nowrap;
    box-shadow:0 2px 6px rgba(0,0,0,.2);
  }

  /* ---- generic app window (Nápověda) ---- */
  .mailapp,.appwin{display:flex;flex-direction:column;height:100%;}
  .app-title{
    flex:0 0 auto;height:46px;background:var(--accent);color:#fff;
    display:flex;align-items:center;gap:16px;padding:0 16px;font-weight:600;font-size:15px;
  }
  .app-title .search{flex:1;max-width:440px;background:rgba(255,255,255,.18);
    border-radius:4px;padding:7px 12px;font-size:13px;color:#eaf2fb;font-weight:400;}
  .app-title .me{margin-left:auto;}
  .avatar{flex:0 0 36px;height:36px;border-radius:50%;display:flex;align-items:center;
    justify-content:center;color:#fff;font-size:14px;font-weight:600;}

  /* ---- Mail ---- */
  .mail-body{flex:1;display:flex;min-height:0;}
  .folders{flex:0 0 210px;background:var(--app-bg);border-right:1px solid var(--border);
    padding:12px 8px;overflow-y:auto;}
  .compose{width:100%;border:1px solid var(--border-strong);background:#fff;color:var(--accent);
    font-weight:600;font-size:14px;padding:9px 12px;border-radius:6px;cursor:pointer;
    margin-bottom:12px;text-align:left;font-family:inherit;}
  .folders ul{list-style:none;margin:0;padding:0;}
  .folders li{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:6px;
    font-size:14px;color:var(--text);}
  .folders li .cnt{margin-left:auto;color:var(--text-2);font-size:12px;font-weight:600;}
  .folders li.active{background:var(--sel-strong);font-weight:600;}

  .list{flex:0 0 340px;background:#fff;border-right:1px solid var(--border);overflow-y:auto;}
  .list-head{padding:12px 16px;font-weight:700;font-size:16px;border-bottom:1px solid var(--border);
    position:sticky;top:0;background:#fff;}
  .email-row{display:flex;gap:12px;padding:12px 16px 12px 12px;border-bottom:1px solid var(--border);
    cursor:pointer;border-left:3px solid transparent;}
  .email-row:hover{background:#f5f9fd;}
  .email-row.selected{background:var(--sel);border-left-color:var(--accent);}
  .email-row.unread{border-left-color:var(--unread);}
  .email-main{flex:1;min-width:0;}
  .email-line1{display:flex;align-items:center;gap:8px;}
  .email-sender{font-size:14px;}
  .email-row.unread .email-sender{font-weight:700;}
  .email-time{margin-left:auto;font-size:12px;color:var(--text-2);white-space:nowrap;}
  .email-subject{font-size:13px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .email-row.unread .email-subject{font-weight:600;color:var(--accent-dark);}
  .email-preview{font-size:12px;color:var(--text-2);margin-top:2px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .dot{flex:0 0 8px;height:8px;border-radius:50%;background:var(--unread);align-self:center;}
  .dot.hidden{visibility:hidden;}

  .reader{flex:1;background:#fff;overflow-y:auto;padding:24px 32px;min-width:0;}
  .reader .subject{font-size:21px;font-weight:600;margin:0 0 14px;}
  .reader-head{display:flex;gap:12px;align-items:center;padding-bottom:16px;
    border-bottom:1px solid var(--border);margin-bottom:18px;}
  .reader-head .avatar{flex:0 0 40px;height:40px;}
  .reader-from .name{font-weight:600;font-size:14px;}
  .reader-from .meta{font-size:12px;color:var(--text-2);}
  .reader-body{font-size:15px;line-height:1.6;max-width:680px;}
  .reader-body p{margin:0 0 12px;}
  .cipher{display:inline-block;font-family:"Consolas","Courier New",monospace;font-size:30px;
    letter-spacing:14px;font-weight:700;color:var(--accent-dark);background:#eef4fb;
    border:2px dashed var(--accent);border-radius:8px;padding:10px 10px 10px 24px;margin:6px 0 16px;}

  .taskbox{max-width:680px;margin-top:24px;border:1px solid var(--border-strong);
    border-radius:10px;padding:18px 20px;background:#fffdf7;}
  .taskbox h3{margin:0 0 14px;font-size:17px;}
  .answer{display:flex;gap:10px;flex-wrap:wrap;align-items:center;}
  .answer input{flex:1;min-width:180px;padding:11px 14px;font-size:16px;
    border:2px solid var(--border-strong);border-radius:8px;text-transform:uppercase;letter-spacing:2px;}
  .answer input:focus{outline:none;border-color:var(--accent);}
  .answer button{padding:11px 20px;font-size:15px;font-weight:600;background:var(--accent);
    color:#fff;border:none;border-radius:8px;cursor:pointer;font-family:inherit;}
  .answer button:hover{background:var(--accent-dark);}
  #feedback{margin-top:14px;}
  .msg{font-size:14px;padding:10px 14px;border-radius:8px;}
  .msg.err{background:#fdeeee;color:var(--err);border:1px solid #f3c6c7;}
  .msg.hint{background:#fff7e6;color:#8a6d00;border:1px solid #f0dca0;}
  .ok-box{background:#eef8ee;border:1px solid #bfe3bf;color:var(--ok);padding:12px 16px;
    border-radius:8px;font-size:15px;font-weight:600;}
  .continue{display:inline-block;margin-top:14px;background:var(--ok);color:#fff;
    text-decoration:none;padding:11px 22px;border-radius:8px;font-weight:600;font-size:15px;}
  .continue:hover{background:#0b5e0b;}
  .shake{animation:shake .35s;}
  @keyframes shake{0%,100%{transform:translateX(0);}25%{transform:translateX(-6px);}75%{transform:translateX(6px);}}

  /* ---- Nápověda app ---- */
  .napoveda{flex:1;overflow-y:auto;padding:28px 32px;background:#fafafa;}
  .napoveda .np-wrap{max-width:620px;margin:0 auto;}
  .np-intro{font-size:14px;color:var(--text-2);background:#eef4fb;border:1px solid #cfe0f3;
    padding:12px 14px;border-radius:8px;margin:0 0 18px;}
  .hint-card{background:#fff;border:1px solid var(--border-strong);border-left:4px solid #e8a30c;
    border-radius:8px;padding:14px 16px;margin-bottom:14px;}
  .hint-card b{display:block;font-size:12px;letter-spacing:.4px;text-transform:uppercase;
    color:#b8790a;margin-bottom:6px;}
  .hint-card p{margin:0;font-size:15px;line-height:1.55;}
  .hint-card code{background:#eef4fb;color:var(--accent-dark);padding:2px 7px;border-radius:4px;font-weight:700;}
  .reveal-btn{background:#e8820c;color:#fff;border:none;padding:11px 20px;border-radius:8px;
    font-size:15px;font-weight:600;cursor:pointer;font-family:inherit;}
  .reveal-btn:hover{background:#cf7109;}
  .all-shown{font-size:13px;color:var(--text-2);}

  .strip{overflow-x:auto;padding:10px 0 2px;}
  .strip-label{font-size:12px;color:var(--text-2);margin:8px 0 4px;font-weight:600;}
  .strip-row{display:flex;gap:3px;min-width:max-content;}
  .cell{flex:0 0 26px;height:30px;border-radius:5px;display:flex;align-items:center;
    justify-content:center;font-family:"Consolas",monospace;font-size:14px;font-weight:600;
    background:#eef1f5;color:var(--text);}
  .cipher-cell{background:#eef4fb;color:var(--accent-dark);}

  @media (max-width:1050px){ .folders{display:none;} }
  @media (max-width:820px){
    .rail{flex:0 0 64px;}
    .rail .rail-title,.rail-app .rl{display:none;}
    .rail-app{justify-content:center;}
    .mail-body{flex-direction:column;}
    .list{flex:0 0 auto;max-height:36vh;border-right:none;border-bottom:1px solid var(--border);}
  }
</style>
</head>
<body>

  <div class="game-bar">
    <div class="brand"><span class="plane">✈️</span>Malý cestovatel</div>
    <div class="task-name">Úkol 1 — Rozlušti tajné město</div>
    <div class="progress-pill">Úkol 1&nbsp;/&nbsp;7</div>
  </div>

  <div class="os-body">
    <nav class="rail" id="rail"></nav>
    <main class="screen" id="screen"></main>
  </div>

<script>
  // Caesarova šifra, posun +2
  const emails=[
    { id:"marco", unread:true, sender:"Marco", initials:"M", color:"#b4009e",
      subject:"Přijeď za mnou na prázdniny! 🤫", time:"9:14",
      preview:"Sejdeme se v jednom krásném městě… ale kde, to je tajné!",
      task:true,
      body:`
        <p>Ahoj cestovateli! 👋</p>
        <p>Moc rád tě u sebe na prázdninách přivítám — přijeď za mnou! 🎉</p>
        <p>Sejdeme se v jednom krásném městě. Abys to neměl(a) moc snadné, jeho jméno jsem ti zašifroval:</p>
        <div class="cipher">OKNCP</div>
        <p>Tak schválně, jestli přijdeš na to, kam letíš! Těším se. 😉<br>Tvůj kamarád <strong>Marco</strong></p>`
    },
    { id:"letiste", unread:false, sender:"Letiště Praha", initials:"✈", color:"#038387",
      subject:"Před cestou: 5 tipů, ať nic neuteče", time:"včera",
      preview:"Doraž na letiště s dostatečným předstihem a nachystej si doklady…",
      body:`<p>Dobrý den,</p><p>děkujeme, že cestujete z našeho letiště. Přijďte s dostatečným předstihem, připravte si doklady a zkontrolujte velikost příručního zavazadla.</p><p>Šťastnou cestu! ✈️</p>` },
    { id:"news", unread:false, sender:"Cestovatel.cz", initials:"C", color:"#ca5010",
      subject:"TOP 10 míst, kam letos v létě", time:"po",
      preview:"Hory, moře i velkoměsta — inspirace na prázdniny je tady…",
      body:`<p>Ahoj,</p><p>připravili jsme pro tebe přehled 10 nejoblíbenějších míst na letošní léto. Kam zamíříš ty?</p>` },
    { id:"operator", unread:false, sender:"Tvůj operátor", initials:"O", color:"#107c10",
      subject:"Roaming v EU máš v ceně 📶", time:"ne",
      preview:"Dobrá zpráva před cestou do zahraničí: voláš a surfuješ jako doma…",
      body:`<p>Dobrý den,</p><p>připomínáme, že v zemích EU voláte a používáte data jako doma. Užijte si cestu bez starostí.</p>` }
  ];

  const apps=[
    {id:"plocha",icon:"🖥️",label:"Plocha"},
    {id:"posta",icon:"📧",label:"Pošta"},
    {id:"napoveda",icon:"💡",label:"Nápověda"}
  ];

  let app="plocha";
  let currentId="marco";
  let mailOpened=false;
  let hintLevel=0;
  let answerValue="";
  let solved=false;

  /* ---------- rail ---------- */
  function renderRail(){
    document.getElementById("rail").innerHTML=
      `<div class="rail-title">Aplikace</div>`+
      apps.map(a=>{
        const glow=(a.id==="posta" && !mailOpened)?"glow":"";
        return `<button class="rail-app ${app===a.id?'active':''} ${glow}" data-app="${a.id}">
          <span class="ri">${a.icon}</span><span class="rl">${a.label}</span></button>`;
      }).join("");
  }

  /* ---------- plocha ---------- */
  function plochaHTML(){
    const posta=`<button class="desk-icon ${mailOpened?'':'glow'}" data-app="posta">
        <span class="di">📧</span><span class="dl">Pošta</span>
        ${mailOpened?'':'<span class="start-here">Začni zde 👆</span>'}
      </button>`;
    const napo=`<button class="desk-icon" data-app="napoveda">
        <span class="di">💡</span><span class="dl">Nápověda</span></button>`;
    const deco=["🗑️ Koš","🌐 Prohlížeč","🎵 Hudba","🖼️ Obrázky"].map(d=>{
        const [i,...n]=d.split(" ");
        return `<div class="desk-icon disabled"><span class="di">${i}</span><span class="dl">${n.join(" ")}</span></div>`;
      }).join("");
    return `<div class="desktop">
        <div class="plane-deco">🛫</div>
        <div class="desk-grid">${posta}${napo}${deco}</div>
      </div>`;
  }

  /* ---------- mail ---------- */
  function listHTML(){
    return emails.map(e=>`
      <div class="email-row ${e.unread?'unread':''} ${e.id===currentId?'selected':''}" data-mail="${e.id}">
        <div class="avatar" style="background:${e.color}">${e.initials}</div>
        <div class="email-main">
          <div class="email-line1"><span class="email-sender">${e.sender}</span><span class="email-time">${e.time}</span></div>
          <div class="email-subject">${e.subject}</div>
          <div class="email-preview">${e.preview}</div>
        </div>
        <div class="dot ${e.unread?'':'hidden'}"></div>
      </div>`).join("");
  }
  function taskboxHTML(){
    if(solved){
      return `<div class="taskbox">
        <div class="ok-box">✅ Správně! Letíš do <strong>Milána</strong>! 🇮🇹</div>
        <a class="continue" href="../02-vyber-letenky/index.html">Pokračovat na další úkol →</a>
      </div>`;
    }
    return `<div class="taskbox">
      <h3>✈️ Do jakého města letíš?</h3>
      <div class="answer">
        <input id="answer" placeholder="NAPIŠ MĚSTO" autocomplete="off" spellcheck="false" value="${answerValue.replace(/"/g,'&quot;')}">
        <button id="check">Zkontrolovat</button>
      </div>
      <div id="feedback"></div>
    </div>`;
  }
  function readerHTML(){
    const e=emails.find(x=>x.id===currentId);
    return `
      <div class="subject">${e.subject}</div>
      <div class="reader-head">
        <div class="avatar" style="background:${e.color}">${e.initials}</div>
        <div class="reader-from"><div class="name">${e.sender}</div>
          <div class="meta">komu: mně &nbsp;•&nbsp; dnes ${e.time}</div></div>
      </div>
      <div class="reader-body">${e.body}${e.task?taskboxHTML():""}</div>`;
  }
  function postaHTML(){
    const unread=emails.filter(e=>e.unread).length;
    return `<div class="mailapp">
      <div class="app-title">📧 Pošta <span class="search">🔍&nbsp; Hledat v e-mailech</span>
        <span class="avatar me" style="background:#5c2d91;margin-left:auto">TY</span></div>
      <div class="mail-body">
        <nav class="folders">
          <button class="compose">✏️&nbsp; Nový e-mail</button>
          <ul>
            <li class="active">📥 Doručená pošta ${unread?`<span class="cnt">${unread}</span>`:''}</li>
            <li>📤 Odeslaná pošta</li><li>📄 Koncepty</li><li>🗑️ Koš</li><li>🚫 Nevyžádaná pošta</li>
          </ul>
        </nav>
        <section class="list"><div class="list-head">Doručená pošta</div>${listHTML()}</section>
        <section class="reader">${readerHTML()}</section>
      </div>
    </div>`;
  }

  /* ---------- nápověda ---------- */
  function stripHTML(){
    const A=[..."ABCDEFGHIJKLMNOPQRSTUVWXYZ"];
    const top=A.map(c=>`<span class="cell">${c}</span>`).join("");
    const bot=A.map((c,i)=>`<span class="cell cipher-cell">${A[(i+2)%26]}</span>`).join("");
    return `<div class="strip">
      <div class="strip-label">✅ Správné písmeno</div><div class="strip-row">${top}</div>
      <div class="strip-label">🔒 Zašifrované písmeno (+2)</div><div class="strip-row">${bot}</div></div>`;
  }
  const HINTS=[
    `<b>Nápověda 1</b><p>Marco použil <strong>Caesarovu šifru</strong>.</p>`,
    `<b>Nápověda 2</b><p>V Caesarově šifře se každé písmeno <strong>posune o stejný počet míst v abecedě</strong>. Zkus zjistit, o kolik.</p>`,
    `<b>Nápověda 3</b><p>Marco posunul každé písmeno o <strong>2 pozice dopředu</strong>. Ty je posuň o <strong>2 pozice zpět</strong>. Například zašifrované <code>O</code> → <code>M</code>.</p>${stripHTML()}`
  ];
  function napovedaHTML(){
    const cards=HINTS.slice(0,hintLevel).map(h=>`<div class="hint-card">${h}</div>`).join("");
    const btn = hintLevel<HINTS.length
      ? `<button class="reveal-btn" id="revealHint">${hintLevel===0?'Zobrazit nápovědu':'Další nápověda'}</button>`
      : `<p class="all-shown">To je vše — víc už neprozradím. 😊 Vrať se do Pošty a zkus to!</p>`;
    return `<div class="appwin"><div class="app-title">💡 Nápověda</div>
      <div class="napoveda"><div class="np-wrap">
        <p class="np-intro">Nejdřív to zkus vyřešit sám/sama. Když si nevíš rady, odkrývej nápovědy postupně — jednu po druhé.</p>
        ${cards}${btn}
      </div></div></div>`;
  }

  /* ---------- render & actions ---------- */
  function renderScreen(){
    const s=document.getElementById("screen");
    s.innerHTML = app==="plocha"?plochaHTML() : app==="posta"?postaHTML() : napovedaHTML();
  }
  function render(){ renderRail(); renderScreen(); }

  function openApp(id){
    if(id==="posta" && !mailOpened){
      mailOpened=true;
      const m=emails.find(e=>e.id==="marco"); if(m) m.unread=false;
    }
    app=id; render();
  }
  function selectEmail(id){
    const e=emails.find(x=>x.id===id); if(e&&e.unread) e.unread=false;
    currentId=id; renderScreen();
  }

  function norm(s){
    return s.trim().toUpperCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^A-Z]/g,"");
  }
  function feedback(html,type){
    const f=document.getElementById("feedback"); if(f) f.innerHTML=`<div class="msg ${type}">${html}</div>`;
  }
  function check(){
    const inp=document.getElementById("answer"); if(!inp) return;
    const v=norm(inp.value);
    if(!v){ feedback("Napiš jméno města. ✍️","hint"); return; }
    if(v.includes("MILAN")){ solved=true; renderScreen(); }
    else{
      feedback("To ještě není ono. Zkus to znovu. 🔁 (Nevíš si rady? Otevři Nápovědu vlevo.)","err");
      inp.classList.remove("shake"); void inp.offsetWidth; inp.classList.add("shake");
    }
  }

  document.addEventListener("click", e=>{
    const railBtn=e.target.closest("[data-app]");
    if(railBtn){ openApp(railBtn.dataset.app); return; }
    const row=e.target.closest("[data-mail]");
    if(row){ selectEmail(row.dataset.mail); return; }
    if(e.target.id==="check"){ check(); return; }
    if(e.target.id==="revealHint"){ if(hintLevel<HINTS.length){hintLevel++; renderScreen();} }
  });
  document.addEventListener("input", e=>{ if(e.target.id==="answer") answerValue=e.target.value; });
  document.addEventListener("keydown", e=>{ if(e.target.id==="answer" && e.key==="Enter") check(); });

  render();
</script>
</body>
</html>
